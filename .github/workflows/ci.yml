name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Blocks machine paths, keys and the private values listed in the PRIVACY_DENYLIST secret.
      - name: Privacy check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: bun scripts/check-privacy.ts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare ChatGPT Web Python runtime
        run: bun run setup:chatgpt-web

      - name: Type check
        run: bun run check

      - name: Bun tests
        run: bun test

      - name: ChatGPT Web bridge tests
        run: bun run test:chatgpt-web-bridge

      - name: Build
        run: bun run build

  # Push to main → after all checks pass, update the production server.
  # The deploy key is restricted on the server to /usr/local/sbin/shenbi-deploy
  # (git reset to origin/main + scripts/deploy/install-server.sh); it cannot open a shell.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 "root@$DEPLOY_HOST" deploy

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL "http://$DEPLOY_HOST/api/health"; then exit 0; fi
            sleep 3
          done
          echo "Production health check failed" >&2
          exit 1
